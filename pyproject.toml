[project]
name = "coletum-mcp"
version = "1.0.2"
description = "Conector MCP (só leitura) para os dados de formulários do Coletum"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pillow>=10",
    "typst>=0.15,<0.16",
    "pdfplumber>=0.11",
    "pypdfium2>=5.9",
]

# Não há pacote a instalar: o uv só resolve as dependências e roda server/server.py.
[tool.uv]
package = false
